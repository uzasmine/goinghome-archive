<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라벨 실내악 라벨링 하기 · Going Home Project</title>
<meta name="description" content="고잉홈프로젝트의 라벨 실내악 전곡 앨범 발매를 기념하여, 라벨 실내악 곡을 심도있게 나누었던 칼럼 8편을 모았습니다.">
<meta name="theme-color" content="#121214">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Going Home Project">
<meta property="og:title" content="라벨 실내악 라벨링 하기">
<meta property="og:description" content="고잉홈프로젝트의 라벨 실내악 전곡 앨범 발매를 기념한 칼럼 아카이브">
<meta property="og:image" content="/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preload" href="assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Layout: a dark private gallery. Column covers hang salon-style; each one sits in a soft pool of
   warm light with no visible fixture. Everything centred, one gothic family (Pretendard) throughout. */
@font-face {
  font-family: "Pretendard Variable";
  src: url("assets/fonts/PretendardVariable.woff2") format("woff2-variations"),
       url("assets/fonts/PretendardVariable.woff2") format("woff2");
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}
:root {
  --wall: #121214;
  --wall-2: #1B1B1E;
  --ink: #ECEAE5;
  --soft: #C9C6C0;
  --muted: #8A8781;
  --line: #2B2B2F;
  --light: 255, 230, 190;            /* warm gallery light, used as rgba(var(--light), a) */
  --frame-shadow: 0 2px 4px rgba(0, 0, 0, .55), 0 26px 44px -20px rgba(0, 0, 0, .95);

  --sans: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --track: -0.012em;                 /* default letter-spacing; Pretendard runs a little loose in Korean */

  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.6;
  letter-spacing: var(--track);
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: break-word;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--wall);
}
a { color: inherit; }
button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid rgba(var(--light), .8); outline-offset: 3px; border-radius: 2px; }
.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: rgba(18, 18, 20, .92);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px;
  border-bottom: 1px solid var(--line);
}
.top-left { display: flex; align-items: center; gap: 4px; min-width: 0; }
.logo { display: block; }
.logo img { display: block; height: 30px; width: auto; }
.icon-btn { width: 36px; height: 36px; margin-left: -8px; display: grid; place-items: center; border-radius: 50%; color: var(--soft); }
.icon-btn:hover { color: var(--ink); background: var(--wall-2); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; flex: none; }
.lang button { font-size: .72rem; font-weight: 600; letter-spacing: .02em; padding: 4px 10px; border-radius: 999px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--wall); }

/* ---------- Intro ---------- */
.intro { padding-block: 52px 8px; text-align: center; }
.intro h1 { margin: 0 auto 22px; line-height: 0; }
.intro h1 img { display: inline-block; width: min(100%, 420px); height: auto; }
@media (min-width: 760px) { .intro h1 img { width: 520px; } }
.intro p {
  margin: 0 auto; max-width: 30em;
  font-size: .9rem; font-weight: 300; line-height: 1.7; color: var(--soft); letter-spacing: -.02em;
}

/* ---------- Listen to the albums ---------- */
.listen { padding-block: 32px 8px; }
.listen-inner { max-width: 760px; margin: 0 auto; }
.listen h2 {
  margin: 0 0 14px; text-align: center;
  font-size: .78rem; font-weight: 600; letter-spacing: -.005em; color: var(--muted);
}
.albums { display: grid; gap: 10px; }
.album {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center;
  padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--wall-2);
}
.album img { width: 64px; height: 64px; border-radius: 4px; display: block; }
.album-name { font-size: .88rem; font-weight: 600; line-height: 1.3; margin: 0 0 8px; letter-spacing: -.02em; }
.platforms { display: flex; flex-wrap: wrap; gap: 6px; }
.platforms a {
  text-decoration: none; font-size: .72rem; font-weight: 500; line-height: 1;
  padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--soft);
  transition: border-color .2s, color .2s, background .2s;
}
.platforms a:hover { color: var(--wall); background: var(--ink); border-color: var(--ink); }
@media (min-width: 680px) { .albums { grid-template-columns: 1fr 1fr; } }

/* ---------- Salon wall ---------- */
.salon { padding-block: 52px 96px; }
.salon-grid {
  list-style: none; margin: 0 auto; padding: 0;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px 20px;
  max-width: 1120px;
}
.salon-grid li {
  min-width: 0; position: relative;
  animation: hang .9s cubic-bezier(.2, .7, .2, 1) both;
  animation-delay: calc(var(--i, 0) * 70ms);
}
.salon-grid li:nth-child(even) { margin-top: 40px; }
@keyframes hang { from { opacity: .15; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* the light: a soft warm pool on the wall behind each piece, brighter when you approach it */
.salon-grid li::before {
  content: ""; position: absolute; left: -16%; right: -16%; top: -12%; bottom: 8%;
  background: radial-gradient(ellipse 58% 52% at 50% 36%, rgba(var(--light), .12), rgba(var(--light), .035) 55%, transparent 78%);
  pointer-events: none; z-index: -1;
  opacity: .7; transition: opacity .6s ease;
}
.salon-grid li:hover::before, .salon-grid li:focus-within::before { opacity: 1; }

.frame {
  position: relative; display: block; width: 100%; aspect-ratio: 4 / 5; max-width: 100%;
  box-shadow: var(--frame-shadow);
  transition: transform .45s cubic-bezier(.2, .7, .2, 1), box-shadow .45s;
  overflow: hidden; background: var(--wall-2);
}
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* light grazing the top of the canvas, falling off toward the bottom */
.frame::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(var(--light), .09) 0%, transparent 32%, transparent 70%, rgba(0, 0, 0, .22) 100%);
}
button.frame:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(0, 0, 0, .55), 0 32px 52px -22px rgba(0, 0, 0, 1); }

.caption { margin-top: 14px; text-align: center; font-size: .74rem; line-height: 1.45; color: var(--muted); letter-spacing: -.01em; }
.caption b { display: block; color: var(--soft); font-weight: 600; font-size: .8rem; margin-bottom: 2px; letter-spacing: -.02em; }
.caption span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.load-error { text-align: center; color: var(--muted); font-size: .85rem; padding-block: 40px; }

@media (min-width: 760px) {
  .intro { padding-block: 84px 8px; }
  .intro p { font-size: .95rem; }
  .salon { padding-block: 76px 120px; }
  .salon-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 68px 40px; }
  .salon-grid li:nth-child(even) { margin-top: 0; }
  .salon-grid li:nth-child(4n+2), .salon-grid li:nth-child(4n+4) { margin-top: 52px; }
}

/* ---------- Reader ---------- */
.reader { padding-block: 32px 160px; }
/* leave room for the open player panel so it never covers the end of the column */
body.has-panel .reader, body.has-panel .salon { padding-bottom: calc(160px + min(56vw, 360px)); }
.reader-inner { max-width: 640px; margin: 0 auto; }
.r-series { font-size: .76rem; font-weight: 500; color: var(--muted); margin: 0 0 14px; }
.r-kicker { font-size: .92rem; font-weight: 500; color: var(--soft); margin: 0 0 4px; letter-spacing: -.02em; }
.r-title { font-size: 1.4rem; font-weight: 700; line-height: 1.35; letter-spacing: -.035em; margin: 0 0 18px; text-wrap: balance; }
.r-movements { list-style: none; margin: 0 0 30px; padding: 0; display: grid; gap: 2px; }
.r-movements button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  font-size: .82rem; color: var(--muted); padding: 5px 0; letter-spacing: -.01em;
}
.r-movements button:hover { color: var(--ink); }
.r-movements .mv-ico { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.r-movements button[aria-current="true"] { color: rgb(var(--light)); }
.r-movements button[aria-current="true"] .mv-ico { border-color: rgba(var(--light), .6); }
.r-sep { border: 0; border-top: 1px solid var(--line); margin: 0 0 28px; }

.prose { font-size: .95rem; line-height: 1.88; color: var(--soft); letter-spacing: -.018em; }
.prose p { margin: 0 0 1.35em; }
.prose blockquote {
  margin: 0 0 1.35em; padding: 2px 0 2px 16px; border-left: 2px solid rgba(var(--light), .5);
  color: var(--ink); font-style: italic; letter-spacing: -.005em;
}
.r-editor { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
.draft-note { display: inline-block; margin: 0 0 18px; font-size: .7rem; padding: 3px 8px; border: 1px dashed var(--line); border-radius: 4px; color: var(--muted); }
.r-loading { color: var(--muted); font-size: .85rem; }

.video { margin: 36px 0 0; }
.video-label { font-size: .76rem; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
.video-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
.video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-link {
  display: flex; align-items: center; gap: 14px; text-decoration: none;
  padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--wall-2);
}
.video-link:hover { border-color: #3A3A40; }
.video-link .vl-ico { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--wall); display: grid; place-items: center; flex: none; }
.video-link b { display: block; font-size: .88rem; font-weight: 600; letter-spacing: -.02em; }
.video-link small { font-size: .74rem; color: var(--muted); }

.pager { margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager button { text-align: left; padding: 8px 0; min-width: 0; color: var(--muted); }
.pager button:last-child { text-align: right; }
.pager button:hover { color: var(--ink); }
.pager small { display: block; font-size: .7rem; }
.pager span { font-size: .88rem; font-weight: 600; color: var(--soft); letter-spacing: -.02em; }
.pager button:disabled { visibility: hidden; }

/* ---------- Player ---------- */
.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-top: 10px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.player-card {
  pointer-events: auto;
  max-width: 640px; margin: 0 auto;
  background: rgba(30, 30, 33, .95);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid #36363B; border-radius: 14px; overflow: hidden;
  box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .8);
}
/* The player stays mounted (never display:none) so the YouTube iframe keeps playing while collapsed. */
.player.is-off { visibility: hidden; transform: translateY(130%); }
.p-panel { padding: 12px 12px 0; display: grid; gap: 10px; }
.player:not(.is-open) .p-panel { height: 0; padding: 0; overflow: hidden; }
.p-screen {
  position: relative; display: grid; place-items: center; align-content: center; gap: 10px;
  aspect-ratio: 16 / 9; max-width: 100%; border-radius: 8px; overflow: hidden;
  background: #0C0C0E; font-size: .78rem; text-align: center; padding: 16px; color: var(--muted);
}
.p-screen.has-yt { padding: 0; }
.p-screen.has-yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.p-hint { font-size: .76rem; color: rgb(var(--light)); text-align: center; margin: 0; }
.p-screen a { font-size: .78rem; font-weight: 600; color: var(--ink); text-decoration: none; border: 1px solid #3A3A40; border-radius: 999px; padding: 6px 12px; }
.p-list { list-style: none; margin: 0; padding: 0; display: grid; }
.p-list button { width: 100%; text-align: left; font-size: .8rem; padding: 7px 4px; color: var(--muted); border-radius: 6px; }
.p-list button:hover { color: var(--ink); background: rgba(255, 255, 255, .04); }
.p-list button[aria-current="true"] { color: rgb(var(--light)); }
.p-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.p-play { width: 40px; height: 40px; border-radius: 50%; background: rgb(var(--light)); color: #1A1814; display: grid; place-items: center; flex: none; }
.p-skip { width: 30px; height: 30px; display: grid; place-items: center; flex: none; color: var(--soft); border-radius: 50%; }
.p-skip:disabled { opacity: .3; cursor: default; }
.p-info { min-width: 0; flex: 1; line-height: 1.3; padding-left: 4px; }
.p-info b { display: block; font-weight: 600; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.02em; }
.p-info span { font-size: .72rem; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-eq { display: inline-flex; gap: 2px; align-items: end; height: 9px; margin-right: 6px; vertical-align: -1px; color: rgb(var(--light)); }
.p-eq i { width: 2px; background: currentColor; height: 30%; }
.is-playing .p-eq i { animation: eq 1s ease-in-out infinite; }
.is-playing .p-eq i:nth-child(2) { animation-delay: -.3s; }
.is-playing .p-eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
.p-toggle { width: 34px; height: 34px; display: grid; place-items: center; flex: none; color: var(--muted); transition: transform .3s; }
.player.is-open .p-toggle { transform: rotate(180deg); }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 21;
  transform: translate(-50%, 8px); opacity: 0; transition: opacity .3s, transform .3s;
  background: var(--ink); color: var(--wall);
  font-size: .78rem; font-weight: 500; padding: 7px 12px; border-radius: 999px; white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.view-enter { animation: rise .45s cubic-bezier(.2, .7, .2, 1); }
@keyframes rise { from { opacity: .4; transform: translateY(10px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="top gutter">
  <div class="top-left">
    <button type="button" class="icon-btn" id="back" aria-label="Back to the wall" data-home hidden>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg>
    </button>
    <button type="button" class="logo" data-home aria-label="Going Home Project">
      <img src="assets/logo.png" alt="Going Home Project" width="80" height="30">
    </button>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="lang-ko" data-lang="ko" aria-pressed="true">KO</button>
    <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<main>
  <section id="home">
    <div class="intro gutter">
      <h1><img id="title-img" src="assets/title.png" alt="라벨 실내악 라벨링 하기" width="598" height="148"></h1>
      <p data-i18n-html="lede"></p>
    </div>

    <section class="listen gutter" aria-labelledby="listen-h">
      <div class="listen-inner">
        <h2 id="listen-h" data-i18n="listen">앨범 전곡 들으러 가기</h2>
        <div class="albums" id="albums"></div>
      </div>
    </section>

    <div class="salon gutter">
      <ul class="salon-grid" id="salon-grid" aria-label="Columns"></ul>
    </div>
  </section>

  <section id="reader" class="reader gutter" hidden>
    <article class="reader-inner" id="reader-inner"></article>
  </section>
</main>

<div class="player is-off" id="player" aria-hidden="true">
  <div class="player-card">
    <div class="p-panel" id="p-panel">
      <div class="p-screen" id="p-screen"><div id="yt-player"></div><span id="p-note"></span></div>
      <p class="p-hint" id="p-hint" hidden></p>
      <ol class="p-list" id="p-list"></ol>
    </div>
    <div class="p-bar">
      <button type="button" class="p-skip" id="p-prev" aria-label="Previous movement">
        <svg width="14" height="14" viewBox="0 0 16 16"><path d="M3 2.5h2v11H3zM14 2.5v11L5.5 8z" fill="currentColor"/></svg>
      </button>
      <button type="button" class="p-play" id="p-play" aria-label="Play"></button>
      <button type="button" class="p-skip" id="p-next" aria-label="Next movement">
        <svg width="14" height="14" viewBox="0 0 16 16"><path d="M11 2.5h2v11h-2zM2 2.5v11L10.5 8z" fill="currentColor"/></svg>
      </button>
      <div class="p-info">
        <b id="p-title"></b>
        <span id="p-sub"></span>
      </div>
      <button type="button" class="p-toggle" id="p-toggle" aria-label="Expand player">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 11 5-5 5 5"/></svg>
      </button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // YouTube needs the page to be served over http(s); opening index.html straight from disk shows links instead.
  const EMBED_YOUTUBE = location.protocol.startsWith("http");

  const ALBUMS = [
    { name: "Ravel Complete Chamber Music I", art: "assets/album-1.webp", links: [
      ["Spotify", "https://open.spotify.com/album/2EgrI1hoTonmJsXZyxH2FE"],
      ["Apple Music", "https://music.apple.com/de/album/ravel-complete-chamber-music-i-going-home-project/1852739847?l=en-GB"],
      ["YouTube Music", "https://music.youtube.com/playlist?list=OLAK5uy_mtq4hwzhqxzjo3bUiROeSS6LO1KkRwImE"],
    ] },
    { name: "Ravel Complete Chamber Music II", art: "assets/album-2.jpg", links: [
      ["Spotify", "https://open.spotify.com/album/0QQOo3abWX27uIQKlXEtvB"],
      ["Apple Music", "https://music.apple.com/de/album/ravel-complete-chamber-music-ii-going-home-project/1855582644?l=en-GB"],
      ["YouTube Music", "https://music.youtube.com/playlist?list=OLAK5uy_n_Z-uGnhUHDPZrS6tKErINbmSUyT-uiEU"],
    ] },
  ];

  const T = {
    ko: {
      h1: "라벨 실내악 라벨링 하기",
      lede: "고잉홈프로젝트의 라벨 실내악 전곡 앨범 발매를 기념하여,<br>일주일에 한 번씩 라벨 실내악 곡을 심도있게 나누었던 칼럼을 모아두었습니다.",
      listen: "앨범 전곡 들으러 가기",
      prev: "이전 칼럼", next: "다음 칼럼", draft: "",
      video: "연주 영상", watch: "연주 영상 보기", watchSub: "YouTube에서 열려요",
      loading: "글을 불러오는 중이에요…", loadFail: "글을 불러오지 못했어요. 페이지를 새로고침해 주세요.",
      wallFail: "전시를 불러오지 못했어요. 페이지를 새로고침해 주세요.",
      pNote: "이 화면에서는 유튜브를 불러올 수 없어요.",
      openYt: "YouTube에서 듣기 ↗",
      tapHint: "재생이 시작되지 않으면 위 영상의 ▶ 버튼을 한 번 눌러 주세요.",
      ytError: "이 곡을 재생할 수 없어요. YouTube에서 들어 주세요.",
      playing: "재생 중", paused: "일시정지", switched: "이 칼럼의 곡으로 바꿨어요",
    },
    en: {
      h1: "Labeling Ravel’s Chamber Music",
      lede: "To celebrate Going Home Project’s release of Ravel’s complete chamber music,<br>we gathered the weekly columns that took a close look at each piece.",
      listen: "Listen to the full albums",
      prev: "Previous", next: "Next", draft: "Translation draft · under review",
      video: "Performance video", watch: "Watch the performance", watchSub: "Opens on YouTube",
      loading: "Loading the column…", loadFail: "The column couldn’t load. Please refresh the page.",
      wallFail: "The exhibition couldn’t load. Please refresh the page.",
      pNote: "YouTube can’t load on this screen.",
      openYt: "Listen on YouTube ↗",
      tapHint: "If playback doesn’t start, tap the ▶ button on the video above once.",
      ytError: "This track can’t be played here. Please listen on YouTube.",
      playing: "Playing", paused: "Paused", switched: "Switched to this column’s music",
    },
  };

  const $ = (s) => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const pad = (n) => String(n).padStart(2, "0");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let DATA = null;                     // content/columns.json
  let COLUMNS = [];
  const texts = {};                    // "01.ko" -> paragraphs
  let lang = store.get("gh-lang") === "en" ? "en" : "ko";
  let current = null;                  // open column id, or null on the wall
  const player = { id: null, track: 0, playing: false, open: false };
  const byId = (id) => COLUMNS.find((c) => c.id === id);

  // ---------- Content ----------
  async function loadText(c, l) {
    const key = `${pad(c.no)}.${l}`;
    if (!texts[key]) {
      const res = await fetch(`content/${key}.txt`);
      if (!res.ok) throw new Error(res.status);
      texts[key] = (await res.text()).trim().split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    }
    return texts[key];
  }
  function paragraphHTML(p) {
    if (p.startsWith("> ")) return `<blockquote>${esc(p.slice(2))}</blockquote>`;
    return `<p>${esc(p)}</p>`;
  }

  // ---------- Wall ----------
  function renderAlbums() {
    $("#albums").innerHTML = ALBUMS.map((a) => `
      <article class="album">
        <img src="${a.art}" alt="${esc(a.name)} album art" width="64" height="64" loading="lazy">
        <div>
          <p class="album-name">${esc(a.name)}</p>
          <nav class="platforms" aria-label="${esc(a.name)}">
            ${a.links.map(([label, href]) => `<a href="${href}" target="_blank" rel="noopener">${label}</a>`).join("")}
          </nav>
        </div>
      </article>`).join("");
  }
  function renderWall() {
    if (!DATA) return;
    $("#salon-grid").innerHTML = COLUMNS.map((c, i) => `
      <li style="--i:${i}">
        <button type="button" class="frame" data-open="${c.id}">
          <img src="${c.cover}" alt="${esc(`${DATA.series[lang]} ${pad(c.no)}. ${c.kicker[lang]} ${c.title[lang]}`)}" width="1080" height="1350" ${i > 3 ? 'loading="lazy"' : ""}>
        </button>
        <div class="caption"><b>${pad(c.no)} · ${esc(c.short[lang])}</b><span>${esc(c.performers)}</span></div>
      </li>`).join("");
  }

  // ---------- Reader ----------
  const ICO_PLAY_S = '<svg width="8" height="8" viewBox="0 0 16 16"><path d="M4.5 2.5v11l9-5.5z" fill="currentColor"/></svg>';
  const ICO_EQ_S = '<svg width="9" height="9" viewBox="0 0 16 16"><path d="M2 6h3v8H2zM6.5 2h3v12h-3zM11 8h3v6h-3z" fill="currentColor"/></svg>';
  async function renderReader() {
    const c = byId(current), L = T[lang];
    const i = COLUMNS.indexOf(c), prev = COLUMNS[i - 1], next = COLUMNS[i + 1];
    const isActive = (k) => player.id === c.id && player.track === k;
    const movements = c.movements ? `<ol class="r-movements">${c.tracks.map((t, k) => `
      <li><button type="button" data-play="${c.id}" data-track="${k}" aria-current="${isActive(k)}">
        <span class="mv-ico">${isActive(k) && player.playing ? ICO_EQ_S : ICO_PLAY_S}</span>${esc(t.title)}
      </button></li>`).join("")}</ol>` : "";
    const video = c.video ? (EMBED_YOUTUBE
      ? `<figure class="video"><p class="video-label">${L.video}</p><div class="video-frame"><div id="video-player"></div></div></figure>`
      : `<figure class="video"><p class="video-label">${L.video}</p><a class="video-link" href="https://youtu.be/${c.video}" target="_blank" rel="noopener">
          <span class="vl-ico"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M4.5 2.5v11l9-5.5z" fill="currentColor"/></svg></span>
          <span><b>${L.watch}</b><small>${L.watchSub}</small></span></a></figure>`)
      : "";

    $("#reader-inner").innerHTML = `
      ${L.draft ? `<span class="draft-note">${L.draft}</span>` : ""}
      <p class="r-series">${esc(DATA.series[lang])} ${pad(c.no)}</p>
      <p class="r-kicker">${esc(c.kicker[lang])}</p>
      <h1 class="r-title">${esc(c.title[lang])}</h1>
      ${movements}
      <hr class="r-sep">
      <div class="prose" id="prose"><p class="r-loading">${L.loading}</p></div>
      <p class="r-editor">${esc(DATA.editor[lang])}</p>
      ${video}
      <nav class="pager">
        <button type="button" ${prev ? `data-open="${prev.id}"` : "disabled"}><small>${L.prev}</small><span>${prev ? esc(prev.short[lang]) : ""}</span></button>
        <button type="button" ${next ? `data-open="${next.id}"` : "disabled"}><small>${L.next}</small><span>${next ? esc(next.short[lang]) : ""}</span></button>
      </nav>`;

    mountVideo(c);
    const want = `${c.id}.${lang}`;
    try {
      const paras = await loadText(c, lang);
      if (`${current}.${lang}` === want) $("#prose").innerHTML = paras.map(paragraphHTML).join("");
    } catch {
      if (`${current}.${lang}` === want) $("#prose").innerHTML = `<p class="r-loading">${L.loadFail}</p>`;
    }
  }
  function refreshMovements() {
    document.querySelectorAll(".r-movements [data-track]").forEach((b) => {
      const on = b.dataset.play === player.id && +b.dataset.track === player.track;
      b.setAttribute("aria-current", on);
      b.querySelector(".mv-ico").innerHTML = on && player.playing ? ICO_EQ_S : ICO_PLAY_S;
    });
  }

  // ---------- YouTube ----------
  // One music player lives in the bottom bar for the whole visit; the performance video gets its own player.
  let yt = null, ytReady = false, loadedVideo = null, videoPlayer = null, hint = "", stuckTimer, switchedAt = 0;
  let ytApi = null;
  function loadYouTubeApi() {
    if (!ytApi) ytApi = new Promise((resolve) => {
      window.onYouTubeIframeAPIReady = () => resolve(window.YT);
      const s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      document.head.append(s);
    });
    return ytApi;
  }
  function setupMusicPlayer(firstVideo) {
    if (!EMBED_YOUTUBE) return;
    $("#p-screen").classList.add("has-yt");
    loadYouTubeApi().then((YT) => {
      loadedVideo = firstVideo;
      yt = new YT.Player("yt-player", {
        host: "https://www.youtube-nocookie.com",
        videoId: firstVideo,
        playerVars: { playsinline: 1, rel: 0 },
        events: {
          onReady: () => { ytReady = true; syncYouTube(); },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              hint = ""; player.playing = true;
              if (videoPlayer && videoPlayer.pauseVideo) videoPlayer.pauseVideo();
            } else if (e.data === YT.PlayerState.PAUSED) {
              // YouTube briefly reports "paused" while swapping tracks; only a real pause should stop the bar.
              if (Date.now() - switchedAt > 1500) player.playing = false;
            } else if (e.data === YT.PlayerState.ENDED) {
              // Multi-movement works continue into the next movement, like an album.
              const c = byId(player.id);
              if (c && player.track < c.tracks.length - 1) player.track++;
              else player.playing = false;
            }
            renderPlayer();
          },
          onError: () => { player.playing = false; hint = T[lang].ytError; renderPlayer(); },
        },
      });
    });
  }
  function syncYouTube() {
    if (!ytReady || !player.id) return;
    const vid = byId(player.id).tracks[player.track].youtube;
    if (vid !== loadedVideo) {
      loadedVideo = vid;
      switchedAt = Date.now();
      if (player.playing) yt.loadVideoById(vid); else yt.cueVideoById(vid);
    } else if (Date.now() - switchedAt > 1500) {
      const st = yt.getPlayerState();
      if (player.playing && st !== 1 && st !== 3) yt.playVideo();
      if (!player.playing && (st === 1 || st === 3)) yt.pauseVideo();
    }
    // Some phones only allow the first play from a tap on the video itself.
    clearTimeout(stuckTimer);
    if (player.playing) stuckTimer = setTimeout(() => {
      const st = yt.getPlayerState();
      if (player.playing && st !== 1 && st !== 3) { hint = T[lang].tapHint; player.open = true; renderPlayer(); }
    }, 2500);
  }
  function mountVideo(c) {
    videoPlayer = null;
    if (!EMBED_YOUTUBE || !c.video) return;
    loadYouTubeApi().then((YT) => {
      if (current !== c.id || !document.getElementById("video-player")) return;
      videoPlayer = new YT.Player("video-player", {
        host: "https://www.youtube-nocookie.com",
        videoId: c.video,
        playerVars: { playsinline: 1, rel: 0 },
        events: {
          // Watching the performance pauses the music bar, so the two never play over each other.
          onStateChange: (e) => { if (e.data === YT.PlayerState.PLAYING && player.playing) { player.playing = false; renderPlayer(); } },
        },
      });
    });
  }

  // ---------- Player bar ----------
  const ICON_PLAY = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4.5 2.5v11l9-5.5z" fill="currentColor"/></svg>';
  const ICON_PAUSE = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/></svg>';
  function renderPlayer() {
    const el = $("#player");
    const visible = !!player.id && (!!current || player.playing);
    el.classList.toggle("is-off", !visible);
    el.setAttribute("aria-hidden", String(!visible));
    document.body.classList.toggle("has-panel", visible && player.open);
    refreshMovements();
    syncYouTube();
    if (!visible) return;
    const c = byId(player.id), t = c.tracks[player.track], L = T[lang], multi = c.tracks.length > 1;
    el.classList.toggle("is-playing", player.playing);
    el.classList.toggle("is-open", player.open);
    $("#p-play").innerHTML = player.playing ? ICON_PAUSE : ICON_PLAY;
    $("#p-play").setAttribute("aria-label", player.playing ? "Pause" : "Play");
    $("#p-prev").hidden = $("#p-next").hidden = !multi;
    $("#p-prev").disabled = player.track === 0;
    $("#p-next").disabled = player.track === c.tracks.length - 1;
    $("#p-title").textContent = c.work;
    $("#p-sub").innerHTML = `<span class="p-eq"><i></i><i></i><i></i></span>${player.playing ? L.playing : L.paused}${multi ? ` · ${esc(t.title)}` : ` · ${esc(c.performers)}`}`;
    $("#p-note").innerHTML = EMBED_YOUTUBE ? "" : `<span>${L.pNote}</span><br><br><a href="https://youtu.be/${t.youtube}" target="_blank" rel="noopener">${L.openYt}</a>`;
    $("#p-hint").hidden = !hint;
    $("#p-hint").innerHTML = hint ? `${esc(hint)} <a href="https://youtu.be/${t.youtube}" target="_blank" rel="noopener">${L.openYt}</a>` : "";
    // The reader already lists the movements, so the panel list only shows away from that column.
    $("#p-list").innerHTML = multi && current !== c.id ? c.tracks.map((x, k) => `<li><button type="button" data-play="${c.id}" data-track="${k}" aria-current="${k === player.track}">${esc(x.title)}</button></li>`).join("") : "";
    $("#p-toggle").setAttribute("aria-label", player.open ? "Collapse player" : "Expand player");
  }
  let toastTimer;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  // ---------- Views ----------
  function openColumn(id, push = true) {
    const c = byId(id);
    if (!c) return showHome(false);
    current = id;
    if (player.id !== id) {
      const wasPlaying = player.playing && player.id;
      player.id = id; player.track = 0;
      if (wasPlaying) toast(T[lang].switched);
    }
    $("#home").hidden = true;
    $("#reader").hidden = false;
    $("#back").hidden = false;
    renderReader(); renderPlayer();
    $("#reader").classList.remove("view-enter"); void $("#reader").offsetWidth; $("#reader").classList.add("view-enter");
    window.scrollTo(0, 0);
    if (push) history.replaceState(null, "", "#" + id);
  }
  function showHome(push = true) {
    const leaving = current;
    current = null;
    $("#reader").hidden = true;
    $("#home").hidden = false;
    $("#back").hidden = true;
    renderPlayer();
    // Return to the cover the reader came from, so they keep their place on the wall.
    const piece = leaving && document.querySelector(`#salon-grid [data-open="${leaving}"]`);
    if (piece) piece.scrollIntoView({ block: "center" }); else window.scrollTo(0, 0);
    if (push) history.replaceState(null, "", location.pathname + location.search);
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T[lang][el.dataset.i18n]; });
    document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = T[lang][el.dataset.i18nHtml]; });
    $("#title-img").alt = T[lang].h1;
    renderWall();
    if (current) renderReader();
    renderPlayer();
  }

  // ---------- Events ----------
  document.addEventListener("click", (e) => {
    const play = e.target.closest("[data-play]");
    if (play) {
      player.id = play.dataset.play; player.track = +play.dataset.track;
      return startPlaying();
    }
    const open = e.target.closest("[data-open]");
    if (open) return openColumn(open.dataset.open);
    if (e.target.closest("[data-home]")) return showHome();
    const l = e.target.closest("[data-lang]");
    if (l) { lang = l.dataset.lang; store.set("gh-lang", lang); return applyLang(); }
  });
  // The first play opens the panel so the YouTube player is on screen when the music starts.
  let openedOnce = false;
  function startPlaying() {
    player.playing = true;
    if (EMBED_YOUTUBE && !openedOnce) { openedOnce = true; player.open = true; }
    renderPlayer();
  }
  $("#p-play").addEventListener("click", () => {
    if (player.playing) { player.playing = false; renderPlayer(); } else startPlaying();
  });
  $("#p-prev").addEventListener("click", () => { player.track = Math.max(0, player.track - 1); renderPlayer(); });
  $("#p-next").addEventListener("click", () => { player.track = Math.min(byId(player.id).tracks.length - 1, player.track + 1); renderPlayer(); });
  $("#p-toggle").addEventListener("click", () => { player.open = !player.open; renderPlayer(); });

  // ---------- Start ----------
  renderAlbums();
  applyLang();
  fetch("content/columns.json")
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((json) => {
      DATA = json;
      COLUMNS = json.columns.map((c) => ({ ...c, id: "c" + pad(c.no) }));
      renderWall();
      setupMusicPlayer(COLUMNS[0].tracks[0].youtube);
      const h = location.hash.slice(1);
      if (h && byId(h)) openColumn(h, false);
    })
    .catch(() => { $("#salon-grid").outerHTML = `<p class="load-error">${T[lang].wallFail}</p>`; });
})();
</script>
</body>
</html>
